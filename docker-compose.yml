# =============================================================================
# Pylon local development stack
#
# Joins the shared edoc Docker network so workers can reach the Laravel app
# containers (onboard-app, esign-app, scriptus-app) and their Mailpit inboxes
# for live pre-investigation and browser testing.
#
# Requires: docker network create edoc (same network as local-proxy)
# =============================================================================

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pylon
      POSTGRES_USER: pylon
      POSTGRES_PASSWORD: pylon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pylon"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.pylon.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - worktrees:/app/worktrees
      - repos:/repos:ro
    env_file: .env
    environment:
      RUN_MIGRATIONS: "true"
    networks:
      - internal
      - edoc
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: celery -A src.pylon.tasks.celery_app worker --loglevel=info --concurrency=3
    volumes:
      - .:/app
      - worktrees:/app/worktrees
      - repos:/repos:ro
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: .env
    networks:
      - internal
      - edoc
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A src.pylon.tasks.celery_app beat --loglevel=info
    volumes:
      - .:/app
    env_file: .env
    networks:
      - internal
    depends_on:
      redis:
        condition: service_healthy

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A src.pylon.tasks.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file: .env
    networks:
      - internal
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  worktrees:
  repos:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${REPOS_BASE_PATH:-/home/jsovine/code/edoc}

networks:
  internal:
  edoc:
    external: true
